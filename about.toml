# The targets CI builds wheels for.
targets = [
  "aarch64-apple-darwin",
  "aarch64-pc-windows-msvc",
  "aarch64-unknown-linux-gnu",
  "aarch64-unknown-linux-musl",
  "armv7-unknown-linux-gnueabihf",
  "armv7-unknown-linux-musleabihf",
  "i686-pc-windows-msvc",
  "i686-unknown-linux-gnu",
  "i686-unknown-linux-musl",
  "powerpc64-unknown-linux-gnu",
  "powerpc64le-unknown-linux-gnu",
  "powerpc64le-unknown-linux-musl",
  "riscv64gc-unknown-linux-gnu",
  "riscv64gc-unknown-linux-musl",
  "s390x-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
]
private = { ignore = true }
ignore-build-dependencies = true
ignore-dev-dependencies = true
accepted = [
  "Apache-2.0",
  "MIT",
  "BSL-1.0",
  "MPL-2.0",
  "Unicode-3.0",
]

# These crates ship no license file, so take the one from their repository at
# the commit they were published from. escape-simd, json-escape-simd,
# parcel_sourcemap and seahash have none there either, and cargo-about cannot
# fetch from the repository URL of minify-html-common (it ends with .git), so
# these get the generic MIT text.

[base64-simd.clarify]
license = "MIT"
git = [{ path = "LICENSE", checksum = "71674605ec4c087fe9eb534e3e4f9e26eb2e4aabcd76a29fd156c6a844d44b3d" }]

[oxc-browserslist.clarify]
license = "MIT"
git = [{ path = "LICENSE", checksum = "6fb8065469e053e7193bd6a82616740b2819725fbd12a027aa99534643247cca" }]

[oxc_index.clarify]
license = "MIT"
git = [{ path = "LICENSE", checksum = "95ced5ecf1133fbf41d409b5555c86c344f83f3b019926057ddbc07cfdcc27b3" }]

[oxc_sourcemap.clarify]
license = "MIT"
git = [{ path = "LICENSE", checksum = "95ced5ecf1133fbf41d409b5555c86c344f83f3b019926057ddbc07cfdcc27b3" }]

[simd-abstraction.clarify]
