git = [{ path = "LICENSE", checksum = "71674605ec4c087fe9eb534e3e4f9e26eb2e4aabcd76a29fd156c6a844d44b3d" }]

[vsimd.clarify]
license = "MIT"
git = [{ path = "LICENSE", checksum = "71674605ec4c087fe9eb534e3e4f9e26eb2e4aabcd76a29fd156c6a844d44b3d" }]

# The oxc crates also contain code ported from other projects, whose notices the
# oxc repository keeps in THIRD-PARTY-LICENSE. It goes under Apache-2.0, the
# license it starts with (for TypeScript and miette), and carries the MIT, BSD
# and ISC notices of the other projects in its own text.

[oxc_allocator.clarify]
license = "MIT AND Apache-2.0"
git = [
  { path = "LICENSE", license = "MIT", checksum = "95ced5ecf1133fbf41d409b5555c86c344f83f3b019926057ddbc07cfdcc27b3" },
  { path = "THIRD-PARTY-LICENSE", license = "Apache-2.0", checksum = "1f350ed29919ae5fa559cd7b2fbcf35b9617124ae06a83b512bef9ae225eff60" },
]

