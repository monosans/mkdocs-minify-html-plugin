name: ✨ Feature request
description: >-
  Suggest a new feature or an improvement to mkdocs-minify-html-plugin.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: >-
        The options are the fields of minify-html's
        [`Cfg`](https://docs.rs/minify-html/latest/minify_html/struct.Cfg.html#fields).
        New minification behavior belongs in
        [minify-html](https://github.com/wilsonzlin/minify-html/issues).
  - type: checkboxes
    id: preflight
    attributes:
      label: Before you start
      options:
        - label: >-
            I searched the [existing
            issues](https://github.com/monosans/mkdocs-minify-html-plugin/issues?q=is%3Aissue)
            and found nothing about this.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: "What are you trying to do, and what gets in the way?"
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: >-
        What should change? Be specific about the behavior you expect.
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Example
      description: How it would look in use.
      render: yaml
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds or other approaches you considered.
